name: 🚀 Deploy
on:
  push:
    branches:
      - main
      - dev
  pull_request:

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  check:
    name: ✅ Check
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💅 Format
        run: pnpm format:check

      - name: 🔬 Type check
        run: pnpm typecheck

      - name: 🧪 Test
        run: pnpm test

  container:
    name: 🔜 Prepare Container
    runs-on: ubuntu-latest
    outputs:
      image_reference: ${{ steps.image_reference.outputs.value }}
    if: ${{ github.ref_name == 'main' || github.ref_name == 'dev'}}

    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 📦 Build Staging Container
        if: ${{ github.ref_name == 'dev'}}
        run: |
          flyctl deploy \
            --remote-only \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 📦 Build Production Container
        if: ${{ github.ref_name == 'main'}}
        run: |
          flyctl deploy \
            --remote-only \
            --build-only \
            --push \
            --image-label ${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 👀 Read App name
        uses: SebRollen/toml-action@v1.2.0
        id: app_name
        with:
          file: ${{ github.ref_name == 'main' && 'fly.toml' || 'fly.staging.toml' }}
          field: app

      - name: 👀 Prepare Image Reference
        id: image_reference
        run: |
          IMAGE="registry.fly.io/${{ steps.app_name.outputs.value }}:${{ github.sha }}"
          echo "value=$IMAGE" >> $GITHUB_OUTPUT

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [check, container]
    if: ${{ github.ref_name == 'main' || github.ref_name == 'dev'}}

    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 🚀 Deploy Staging
        if: ${{ github.ref_name == 'dev'}}
        run: |
          flyctl deploy \
            --config fly.staging.toml \
            --image "${{ needs.container.outputs.image_reference }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy Production
        if: ${{ github.ref_name == 'main'}}
        run: |
          flyctl deploy \
            --image "${{ needs.container.outputs.image_reference }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
