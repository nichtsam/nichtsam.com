name: 🚀 Deploy
on:
  push:
    branches:
      - main
      - dev

env:
  NODE_VERSION: 24

  SENTRY_ORG: 'samuel-jensen'
  SENTRY_PROJECT: 'nichtsam-com'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  lint:
    name: 🧶 ESLint
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🧶 Lint
        run: pnpm lint

  typecheck:
    name: 🔬 TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🔬 Type check
        run: pnpm typecheck

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: ⚡ Run vitest
        run: pnpm coverage

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck, vitest]
    if: ${{ github.ref_name == 'main' }}

    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      # Every page is prerendered, so the env is read here and not at runtime
      - name: 🏗️ Build
        run: pnpm build
        env:
          COMMIT_SHA: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      - name: 🚀 Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
