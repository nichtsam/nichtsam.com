name: 🚀 Deploy
on:
  push:
    branches:
      - main
      - dev

env:
  NODE_VERSION: 24

  SENTRY_ORG: 'samuel-jensen'
  SENTRY_PROJECT: 'nichtsam-com'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  lint:
    name: 🧶 ESLint
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🧶 Lint
        run: pnpm lint

  typecheck:
    name: 🔬 TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: 🔬 Type check
        run: pnpm typecheck

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install

      - name: ⚡ Run vitest
        run: pnpm coverage

  container:
    name: 🔜 Prepare Container
    runs-on: ubuntu-latest
    outputs:
      image_reference: ${{ steps.image_reference.outputs.value }}
    if: ${{ github.ref_name == 'main' || github.ref_name == 'dev'}}

    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 📦 Build Staging Container
        if: ${{ github.ref_name == 'dev'}}
        run: |
          flyctl deploy \
            --remote-only \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 📦 Build Production Container
        if: ${{ github.ref_name == 'main'}}
        run: |
          flyctl deploy \
            --remote-only \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-secret SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} \
            --build-arg SENTRY_ORG=${{ env.SENTRY_ORG}} \
            --build-arg SENTRY_PROJECT=${{ env.SENTRY_PROJECT}} \
            --build-arg COMMIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 👀 Read App name
        uses: SebRollen/toml-action@v1.2.0
        id: app_name
        with:
          file:
            ${{ github.ref_name == 'main' && 'fly.toml' || 'fly.staging.toml' }}
          field: app

      - name: 👀 Prepare Image Reference
        id: image_reference
        run: |
          IMAGE="registry.fly.io/${{ steps.app_name.outputs.value }}:${{ github.sha }}"
          echo "value=$IMAGE" >> $GITHUB_OUTPUT

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [lint, typecheck, vitest, container]
    if: ${{ github.ref_name == 'main' || github.ref_name == 'dev'}}

    steps:
      - name: 👀 Checkout repo
        uses: actions/checkout@v6

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 🚀 Deploy Staging
        if: ${{ github.ref_name == 'dev'}}
        run: |
          flyctl deploy \
            --config fly.staging.toml \
            --image "${{ needs.container.outputs.image_reference }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy Production
        if: ${{ github.ref_name == 'main'}}
        run: |
          flyctl deploy \
            --image "${{ needs.container.outputs.image_reference }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
